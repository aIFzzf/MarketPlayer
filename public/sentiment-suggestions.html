<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪建议审批 - MarketPlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 20px; }
    .suggestion-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .symbol { font-size: 24px; font-weight: bold; color: #333; }
    .agent-analysis { background: #f8f9fa; border-left: 4px solid #007bff; padding: 16px; margin: 20px 0; border-radius: 4px; }
    .agent-analysis pre { white-space: pre-wrap; font-family: inherit; line-height: 1.6; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-right: 10px; }
    .btn-approve { background: #28a745; color: white; }
    .btn-reject { background: #dc3545; color: white; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 情绪建议审批</h1>
    <div id="suggestions" class="suggestions"><div class="loading">加载中...</div></div>
  </div>
  <script>
    async function loadSuggestions() {
      try {
        const response = await fetch('/api/sentiment/suggestions?status=pending');
        const result = await response.json();
        const container = document.getElementById('suggestions');
        if (!result.success || result.data.length === 0) {
          container.innerHTML = '<div class="loading">暂无待审批建议</div>';
          return;
        }
        container.innerHTML = result.data.map(s => `
          <div class="suggestion-card">
            <div class="symbol">${s.symbol} - ${s.event_type}</div>
            <p>情绪分数: ${s.sentiment_score} | 变化: ${s.sentiment_change}</p>
            <div class="agent-analysis"><h3>Agent分析</h3><pre>${s.agent_analysis}</pre></div>
            <p><strong>建议: ${s.suggested_action}</strong> | 置信度: ${(s.confidence*100).toFixed(0)}% | 风险: ${s.risk_level}</p>
            <p>理由: ${s.reason}</p>
            <button class="btn btn-approve" onclick="approve(${s.id})">✅ 批准</button>
            <button class="btn btn-reject" onclick="reject(${s.id})">❌ 拒绝</button>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('suggestions').innerHTML = '<div class="loading">加载失败</div>';
      }
    }
    async function approve(id) {
      if (!confirm('确认批准？')) return;
      const response = await fetch(`/api/sentiment/suggestions/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review_note: '手动批准' })
      });
      if ((await response.json()).success) { alert('✅ 已批准'); loadSuggestions(); }
    }
    async function reject(id) {
      const note = prompt('拒绝理由：');
      if (!note) return;
      const response = await fetch(`/api/sentiment/suggestions/${id}/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review_note: note })
      });
      if ((await response.json()).success) { alert('✅ 已拒绝'); loadSuggestions(); }
    }
    loadSuggestions();
    setInterval(loadSuggestions, 30000);
  </script>
</body>
</html>
